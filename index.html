<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신통방 - AI 권도령 커밍순</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 15vh;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { 
            font-size: 3rem; 
            color: #38bdf8; 
            margin-bottom: 10px;
        }
        
        /* 📸 권도령 이미지 스타일링 */
        .character-box {
            margin: 30px auto;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 캐릭터가 귀엽게 위아래로 둥둥 뜨는 애니메이션 */
            animation: float 3s ease-in-out infinite; 
        }
        .character-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 20px; /* 사각형일 경우 모서리를 부드럽게 */
        }

        p { font-size: 1.2rem; color: #94a3b8; line-height: 1.6; }
        .highlight { color: #f59e0b; font-weight: bold; } /* 주황색 포인트 */

        /* 둥둥 뜨는 모션 정의 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 신통방 (Sintongbang)</h1>
        
        <!-- 📸 권도령 삽질 이미지 구역 -->
        <div class="character-box">
            <!-- 이미지 파일 이름을 여기에 적어주세요 -->
            <img src="character.png" alt="열심히 삽질 중인 AI 권도령">
        </div>

        <p>신통방에서 <span class="highlight">권도령</span>이 열심히 삽질하며 정진 중입니다.</p>
        <p><strong>Coming Soon!</strong></p>
    </div>
</body>
</html>
