<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신통방 - AI 권도령 커밍순</title>
    <style>
        body { 
            /* 1. 배경 화면을 흰색(#ffffff)으로 변경 */
            background-color: #ffffff; 
            /* 2. 배경이 밝아졌으므로 글자색을 어두운 톤(#1e293b)으로 변경 */
            color: #1e293b; 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 5vh;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { 
            font-size: 3rem; 
            /* 타이틀 색상을 흰색 배경에 잘 어울리는 깊은 블루 톤으로 변경 */
            color: #0284c7; 
            margin-top: 0;
            margin-bottom: 10px;
        }
        
        /* 📸 권도령 이미지 스타일링 */
        .character-box {
            margin: 30px auto;
            width: 400px; /* 삽질하는 가로형 이미지에 맞춰 크기 최적화 */
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 캐릭터가 귀엽게 위아래로 둥둥 뜨는 애니메이션 */
            animation: float 3s ease-in-out infinite; 
        }
        .character-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 설명 글자색을 부드러운 다크 그레이로 변경 */
        p { font-size: 1.2rem; color: #475569; line-height: 1.6; }
        /* 포인트 컬러를 흰색 배경에서 눈에 잘 띄는 진한 주황색으로 변경 */
        .highlight { color: #ea580c; font-weight: bold; } 

        /* 둥둥 뜨는 모션 정의 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 신통방 (神通房)</h1>
        
        <div class="character-box">
            <img src="character.jpg" alt="열심히 삽질 중인 AI 권도령">
        </div>

        <p>오는 8월 당신을 만나기 위해 <span class="highlight">권도령</span>이 열심히 정진 중입니다.</p>
        <p><strong>Coming Soon!</strong></p>
    </div>
</body>
</html>
